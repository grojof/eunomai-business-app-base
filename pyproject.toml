[project]
name = "business-app-base"
version = "0.1.0"
description = "A demo business application to clone and adapt."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "babel>=2.18,<3",
    "fastapi>=0.143,<1",
    "jinja2>=3.1.6,<4",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.32,<1",
    "sqlalchemy>=2.1,<3",
    "tzdata>=2025.2",  # Windows has no time zone database of its own. No upper limit: its versions are dates
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.13,<3",
    "playwright>=1.64,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false
# Nothing younger than two weeks. tools/update_dependencies.py adds an exception only for a version that fixes a
# known vulnerability, and removes it once the two weeks have passed.
exclude-newer = "14 days"
exclude-newer-package = {}

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["%(here)s"]

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "exec"
executable = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A deprecated call breaks the tests now rather than the application after an upgrade.
filterwarnings = ["error::DeprecationWarning"]
addopts = "--strict-markers"
markers = [
    "browser: needs a real browser",
    "rule(identifier): the rule of docs/standards.md this test proves",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"tools/**" = ["S310", "S603", "S607"]
"migrations/versions/*" = ["F401"]  # the template imports the exact types, and not every migration uses them

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tools", "migrations/env.py"]
