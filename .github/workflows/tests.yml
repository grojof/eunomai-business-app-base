name: Tests

# Started by hand, and by the Dependencies workflow on its own pull requests: the whole suite runs on a computer before
# each push, and here now and then, to confirm Ubuntu and PostgreSQL. Not on every pull request, to spend few minutes.
on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu with PostgreSQL. Windows is where the suite runs before each push.
        os: ["ubuntu-latest"]
        include:  # adds to the Ubuntu run. Windows runners have no service containers: an empty image starts none
          - os: ubuntu-latest
            postgres: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
            test_database_url: postgresql+psycopg://postgres@localhost:5432/postgres
    runs-on: ${{ matrix.os }}
    # The Ubuntu job took 15.6 minutes before milestone 4 and 20.8 with it: its views brought about 700 tests, most of
    # them a browser scan of one screen in one theme and language, and no single slow one. The limit keeps room for that
    # and for Windows, which is slower; --durations shows in each log where the time goes.
    timeout-minutes: 35
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # a container for one run, so no password to keep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: ${{ matrix.test_database_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen mypy
      - run: uv run --frozen python tools/vendor.py check
      - run: uv run --frozen python tools/css.py check
      - run: uv run --frozen python tools/components.py check
      - run: uv run --frozen python tools/gallery.py check
      - run: uv run --frozen python tools/icons.py check
      - run: uv run --frozen python tools/translations.py check
      # in parallel on the runner's cores (two to four), then the tests marked serial, alone: as tools/test.py does
      - run: uv run --frozen pytest -q -n auto -m "not serial" --durations=25
      - run: uv run --frozen pytest -q -m serial
