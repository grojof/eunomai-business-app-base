name: Tests

on:
  pull_request:
  workflow_dispatch:  # started by the Dependencies workflow on its own pull requests

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
      - run: uv lock --check
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen mypy
      - run: uv run --frozen python tools/vendor.py check
      - run: uv run --frozen python tools/css.py check
      - run: uv run --frozen python tools/components.py check
      - run: uv run --frozen python tools/gallery.py check
      - run: uv run --frozen python tools/translations.py check
      - run: uv run --frozen pytest -q
