name: Dependencies

# Every Monday: bring dependencies to the newest versions the rules allow, propose them as one pull request, and keep an
# issue open while anything no allowed version solves remains.
#
# The job that runs freshly upgraded packages has read-only access. Writing (branch, pull request, issue) happens in
# separate jobs on fresh runners that execute no project code and accept only the files the update produces.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false  # the updated packages must come from the rules, never from an earlier run

      - name: Update within the rules
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          uv run --frozen --python 3.12 python tools/update_dependencies.py \
            --summary "$RUNNER_TEMP/out/summary.md" --problems "$RUNNER_TEMP/out/problems.md"

      - name: Test the update
        env:
          TESTS_ON_SQLITE_ALONE: "true"  # no database in this job: the pull request it opens runs them on PostgreSQL
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          uv sync --frozen --python 3.12
          uv run --frozen python tools/gallery.py
          uv run --frozen python tools/css.py
          uv run --frozen python tools/components.py
          uv run --frozen pytest -q
          { git diff --name-only -z; git ls-files -o --exclude-standard -z; } | tar --null -T - -cf "$RUNNER_TEMP/out/update.tar"

      # A failure must reach the issue. update.tar exists only if the tests passed, and `propose` needs success.
      - name: Record that the update failed
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "- The update failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$RUNNER_TEMP/out/problems.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: update
          path: ${{ runner.temp }}/out/
          retention-days: 5

  propose:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: automation/dependencies
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: update
          path: ${{ runner.temp }}/in
      - name: Propose the update
        run: |
          allowed='^(uv\.lock|pyproject\.toml|vendor\.json|app/ui/static/app\.css|app/ui/static/vendor/[^/]+|tests/vendor/[^/]+|tools/tailwind/[^/]+|tools/lucide/[^/]+|app/ui/templates/ui/icons/[^/]+|docs/components/[^/]+|app/demo/examples/[^/]+)$'
          unexpected=$(tar -tf "$RUNNER_TEMP/in/update.tar" | grep -v -E "$allowed" || true)
          if [ -n "$unexpected" ]; then echo "unexpected files: $unexpected"; exit 1; fi
          tar -xf "$RUNNER_TEMP/in/update.tar"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -q --no-verify -m "Dependencies: newest versions the rules allow"
          git push -qf "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          {
            cat "$RUNNER_TEMP/in/summary.md"
            echo
            echo "Prepared by the weekly Dependencies workflow; tests passed on Linux, and the Tests workflow was"
            echo "started on Linux and Windows for this branch (see Actions)."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Dependencies: newest versions the rules allow" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run tests.yml --ref "$BRANCH"

  report:
    needs: update
    # Reads only problems.md, as text, and runs no project code: safe after a failed update too.
    if: always() && (needs.update.result == 'success' || needs.update.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Dependencies: problems no allowed version solves"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: update
          path: ${{ runner.temp }}/in
      - name: Keep the issue in line with the problems
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -s "$RUNNER_TEMP/in/problems.md" ]; then
            if [ -n "$number" ]; then gh issue edit "$number" --body-file "$RUNNER_TEMP/in/problems.md"
            else gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/in/problems.md"; fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Resolved: the weekly check finds no problem left."
          fi
