# Where and with what eunomai-business's specialist may write code in this repository, and how a person's computer
# starts it. Treat it like AGENTS.md: changed through a reviewed pull request.

[development]
code = true
technologies = ["Python", "FastAPI", "Pydantic", "SQLAlchemy", "Alembic", "PostgreSQL", "SQLite", "Jinja2", "htmx",
                "Tailwind CSS", "daisyUI", "Chart.js", "XlsxWriter", "HTML and CSS"]

# The application on a person's computer, from a fresh export with no .env. Each command runs after `uv run --frozen`,
# in the export, with the environment below: `setup` on every version, then `run`. `{data}` is a folder the connector
# keeps from one version to the next. See docs/base/adapting-it.md#adapting-it
[preview]
setup = [["python", "-m", "app.demo.generate", "--if-empty"]]
run = ["uvicorn", "app.main:app", "--no-proxy-headers", "--host", "127.0.0.1", "--port", "{port}"]

# A made-up person with the admin role, so nobody signs in, and the database and files in the kept folder.
[preview.environment]
APP_ENVIRONMENT = "development"
APP_DATABASE_URL = "sqlite:///{data}/preview.db"
APP_UPLOAD_FOLDER = "{data}/uploads"
APP_FAKE_IDENTITY = "true"
APP_FAKE_GROUPS = '["demo-admins"]'
APP_ROLE_GROUPS = '{"admin":["demo-admins"]}'

# The tests on a person's computer, where IT allows it: the browser checks use Edge, which Windows has.
[tests]
run = ["python", "tools/test.py", "--", "--ignore=tests/demo/test_clean_application.py", "--ignore=tests/demo/test_template.py", "--ignore=tests/demo/test_new_module.py"]  # those download Tailwind, so CI runs them
some = ["python", "tools/test.py", "--"]  # some test files, which a connector adds: what a change can break, while it is built

[tests.environment]
APP_BROWSER_CHANNEL = "msedge"
